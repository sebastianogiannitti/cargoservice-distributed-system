# URL del server Eureka  USATO PER REGISRARE
# Ordine: prima il nome del servizio nella rete Docker, poi localhost per
# l'esecuzione fuori da Docker. Nessun IP cablato: un indirizzo non
# raggiungibile blocca ogni lookup sui timeout di NoRouteToHost e fa
# scadere le richieste (discoverAndSend ... request timeout).
eureka.serviceUrl.defaultZone=http://eureka:8761/eureka/,http://localhost:8761/eureka/
 # Porta del servizio
eureka.instance.appname=ctxcargoholdservice
#eureka.instance.ipAddress=192.168.1.10
eureka.instance.port=8888
# Intervallo di rinnovo del lease (cuore pulsante)
eureka.leaseRenewalIntervalInSeconds=60
eureka.instance.prefer-ip-address=true

# Intervallo di espirazione del lease
eureka.leaseExpirationDurationInSeconds=60